[project]
name = "snnkern"
version = "0.1.0"
description = "Event-driven sparse spiking neural network simulation kernel"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

# torch/triton intentionally omitted: pip would resolve them from PyPI and
# could replace the cluster-specific CUDA build.
#   pip install torch --index-url https://download.pytorch.org/whl/cu126

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.9", "pandas>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
